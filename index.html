<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apa nak makan tonight?</title>
    <meta name="description" content="A fun Malaysian dish picker that randomly chooses what to eat tonight." />
    <meta property="og:title" content="Apa nak makan tonight?" />
    <meta property="og:description" content="A fun Malaysian dish picker that randomly chooses what to eat tonight." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; text-align: center; color: #1c1917; font-family: 'Fredoka', system-ui, sans-serif; overflow-x: hidden; background: radial-gradient(circle at top left, #fde68a, transparent 45%), radial-gradient(circle at bottom right, #fbcfe8, transparent 45%), #fff7ed; }
      main { width: 100%; max-width: 36rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
      h1 { font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1.08; font-weight: 700; text-wrap: balance; background: linear-gradient(120deg, #ea580c, #db2777 55%, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
      button { font: inherit; font-size: clamp(1.2rem, 3.5vw, 1.5rem); font-weight: 600; padding: 1rem 2.25rem; border: 0; border-radius: 1.25rem; cursor: pointer; color: #fff; background: linear-gradient(135deg, #f97316, #e11d48); box-shadow: 0 6px 0 #9f1239, 0 12px 24px rgba(225, 29, 72, 0.25); transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.14s ease; touch-action: manipulation; }
      button:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #9f1239, 0 16px 28px rgba(225, 29, 72, 0.3); }
      button:active { transform: translateY(4px); box-shadow: 0 2px 0 #9f1239, 0 6px 12px rgba(225, 29, 72, 0.2); }
      button:focus-visible { outline: 3px solid #7c3aed; outline-offset: 4px; }
      #result { width: 100%; height: calc(min(76vw, 20rem) + 5.25rem); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1rem; }
      .stage { position: relative; width: min(76vw, 20rem); aspect-ratio: 1 / 1; display: grid; place-items: center; flex-shrink: 0; }
      .pointer { position: absolute; top: -10px; z-index: 4; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #be123c; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
      .circle { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 6px solid #fff; box-shadow: 0 14px 32px rgba(154, 52, 18, 0.2); background: linear-gradient(135deg, #fed7aa, #fecdd3); }
      .circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .wheel { position: relative; width: 100%; height: 100%; border-radius: 50%; transform: rotate(22.5deg); background: conic-gradient(#f97316 0 45deg, #eab308 45deg 90deg, #ec4899 90deg 135deg, #8b5cf6 135deg 180deg, #06b6d4 180deg 225deg, #22c55e 225deg 270deg, #ef4444 270deg 315deg, #fb923c 315deg 360deg); }
      .wheel.spin { animation: spin 1.85s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
      .wheel::after { content: ''; position: absolute; inset: 41%; border-radius: 50%; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
      .wheel span { position: absolute; top: 0; left: 50%; width: 2rem; height: 50%; margin-left: -1rem; transform-origin: 50% 100%; display: flex; justify-content: center; padding-top: 11%; font-size: clamp(1.35rem, 5vw, 1.85rem); font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.28); }
      .confetti { position: absolute; left: 50%; top: 50%; width: 10px; height: 6px; border-radius: 2px; z-index: 5; pointer-events: none; animation: shoot 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .dish-name { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 700; color: #9a3412; line-height: 1.1; white-space: nowrap; }
      .pop { animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes spin { from { transform: rotate(22.5deg); } to { transform: rotate(var(--end)); } }
      @keyframes pop { 0% { opacity: 0; transform: scale(0.86); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes shoot { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.7); } }
      @media (prefers-reduced-motion: reduce) { .pop, .wheel, .confetti { animation: none; } button { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Apa nak makan tonight?</h1>
      <button id="pickBtn" type="button">Pilih untuk saya!</button>
      <div id="result" aria-live="polite"></div>
    </main>
    <script>
      const dishes = [
        ['Nasi Lemak', '/src/assets/images/nasi_lemak_1794974692014.jpg'], ['Roti Canai', '/src/assets/images/roti_canai_1794974692082.jpg'],
        ['Laksa', '/src/assets/images/laksa_1794974692351.jpg'], ['Satay', '/src/assets/images/satay_1794974692765.jpg'],
        ['Mee Goreng', '/src/assets/images/mee_goreng_1794974694875.jpg'], ['Cendol', '/src/assets/images/cendol_1794974693905.jpg'],
        ['Rendang', '/src/assets/images/rendang_1794974694412.jpg'], ['Teh Tarik', '/src/assets/images/teh_tarik_1794974695072.jpg'],
        ['Mee Rebus', '/src/assets/images/mee_rebus_1794974695112.jpg'], ['Nasi Kerabu', '/src/assets/images/nasi_kerabu_1794974696716.jpg']
      ];
      const colors = ['#f97316', '#eab308', '#ec4899', '#8b5cf6', '#06b6d4', '#22c55e', '#ef4444'];
      const wedges = Array.from({ length: 8 }, (_, i) => `<span style="transform:rotate(${i * 45 + 22.5}deg)">?</span>`).join('');
      const wheel = (cls, end) => `<div class="stage"><div class="pointer"></div><div class="circle"><div class="wheel ${cls}" style="--end:${end}deg" aria-label="Prize wheel">${wedges}</div></div></div>`;
      const btn = document.getElementById('pickBtn'), result = document.getElementById('result');
      let t1, t2;
      result.innerHTML = wheel('', 22.5);
      btn.addEventListener('click', () => {
        clearTimeout(t1); clearTimeout(t2);
        const [name, img] = dishes[Math.floor(Math.random() * dishes.length)];
        new Image().src = img;
        result.innerHTML = wheel('spin', 1462.5 + Math.floor(Math.random() * 8) * 45);
        t1 = setTimeout(() => {
          const bits = Array.from({ length: 36 }, (_, i) => {
            const a = (i / 36) * Math.PI * 2 + (Math.random() - 0.5) * 0.3, d = 95 + Math.random() * 115;
            return `<i class="confetti" style="background:${colors[i % 7]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 20}px;--rot:${Math.random() * 540 - 270}deg"></i>`;
          }).join('');
          result.innerHTML = `<div class="stage"><div class="circle pop"><img src="${img}" alt="Photo of ${name}" referrerpolicy="no-referrer" onerror="this.style.display='none'" /></div>${bits}</div>`;
          t2 = setTimeout(() => result.insertAdjacentHTML('beforeend', `<span class="dish-name pop">${name}!</span>`), 350);
        }, 2000);
      });
    </script>
  </body>
</html>
